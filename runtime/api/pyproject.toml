[project]
name = "ams-api"
version = "0.1.0"
description = "AMS FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  "asyncpg==0.30.0",
  "fastapi==0.115.12",
  "httpx==0.28.1",
  "sqlalchemy==2.0.40",
  "uvicorn[standard]==0.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest==8.3.5",
  "pytest-asyncio==0.25.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
